apiVersion: apps/v1
kind: Deployment
metadata:
  name: gemma-vllm
spec:
  replicas: 1
  selector: { matchLabels: { app: gemma-vllm } }
  template:
    metadata: { labels: { app: gemma-vllm } }
    spec:
      containers:
      - name: vllm
        image: vllm/vllm-openai:latest
        args: ["--model=google/gemma-3-1b-it","--max-model-len=2048"]
        env:
        - name: HUGGING_FACE_HUB_TOKEN
          valueFrom: { secretKeyRef: { name: hf-secret, key: hf_token } }
        ports: [{ containerPort: 8000 }]
        resources:
          limits:
            nvidia.com/gpu: "1"
      nodeSelector:
        cloud.google.com/gke-accelerator: nvidia-l4
---
apiVersion: v1
kind: Service
metadata:
  name: gemma-vllm-svc
  annotations:
    networking.gke.io/load-balancer-type: "Internal"   # internal LB, private IP
spec:
  type: LoadBalancer
  selector: { app: gemma-vllm }
  ports: [{ port: 80, targetPort: 8000 }]
