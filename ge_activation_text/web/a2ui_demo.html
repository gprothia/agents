<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>A2UI demo — GE Activation Agent</title>
<style>
  :root{ --blue:#4285F4; --blueD:#1967D2; --green:#34A853; --red:#EA4335;
         --ink:#202124; --grey:#5f6368; --line:#e8eaed; --bg:#f8f9fa; }
  *{ box-sizing:border-box; }
  body{ font-family:Arial,Helvetica,sans-serif; color:var(--ink); margin:0; background:#fff; }
  header{ padding:20px 28px; border-bottom:1px solid var(--line); }
  header h1{ font-size:18px; margin:0; }
  header p{ margin:4px 0 0; color:var(--grey); font-size:13px; }
  main{ max-width:820px; margin:24px auto; padding:0 20px; }
  textarea{ width:100%; height:150px; font-family:ui-monospace,Menlo,Consolas,monospace;
            font-size:12px; border:1px solid var(--line); border-radius:8px; padding:10px; }
  button.load{ margin:10px 0 24px; background:var(--blue); color:#fff; border:0;
               border-radius:6px; padding:9px 16px; font-weight:700; cursor:pointer; }
  .card{ border:1px solid var(--line); border-radius:12px; padding:18px 20px; margin:14px 0;
         box-shadow:0 1px 3px rgba(0,0,0,.06); }
  .oneway{ display:inline-block; background:#fef7e0; color:#b06000; font-weight:700;
           font-size:11px; padding:3px 10px; border-radius:10px; margin-bottom:8px; }
  .card h2{ font-size:19px; margin:2px 0 4px; }
  .sum{ color:var(--grey); margin:0 0 12px; }
  .lab{ font-size:11px; letter-spacing:1px; color:var(--grey); font-weight:700; margin:12px 0 4px; }
  ul{ margin:4px 0; padding-left:2px; list-style:none; }
  li{ margin:4px 0; padding-left:22px; position:relative; font-size:14px; }
  li.pro::before{ content:"✓"; color:var(--green); position:absolute; left:0; font-weight:800; }
  li.warn::before{ content:"•"; color:#b06000; position:absolute; left:2px; font-weight:800; font-size:18px; line-height:14px;}
  .src{ font-size:12px; color:var(--grey); margin-top:10px; }
  .row{ display:flex; gap:10px; margin-top:14px; }
  .row button{ border-radius:6px; padding:9px 16px; font-weight:700; cursor:pointer; font-size:13px; }
  .btn-approve{ background:var(--blue); color:#fff; border:0; }
  .btn-adjust{ background:#fff; color:var(--blue); border:1px solid var(--line); }
</style>
</head>
<body>
<header>
  <h1>A2UI demo — GE Activation Agent</h1>
  <p>Paste the JSONL that <code>build_recommendation_ui</code> / <code>run_simulated.py</code> emits, then Render. This is the POC-grade viewer for the subset of A2UI used here.</p>
</header>
<main>
  <textarea id="src" spellcheck="false"></textarea>
  <button class="load" onclick="render()">Render surface</button>
  <div id="out"></div>
</main>

<script>
// A tiny interpreter for the A2UI subset used in this POC.
const SAMPLE = `{"surfaceUpdate":{"surfaceId":"recommendation","components":[{"id":"card","component":{"RecommendationCard":{"title":{"path":"/rec/title"},"summary":{"path":"/rec/summary"},"one_way":{"path":"/rec/one_way"},"pros":{"path":"/rec/pros"},"watchouts":{"path":"/rec/watchouts"},"rationale":{"path":"/rec/rationale"},"source_url":{"path":"/rec/source_url"}}}}]}}
{"dataModelUpdate":{"surfaceId":"recommendation","path":"/rec","contents":{"title":"Region eu + CMEK","summary":"Data in 'eu', customer-managed (CMEK) encryption","one_way":true,"pros":["Meets EU data residency (GDPR)","You control the keys; supports third-party connectors"],"watchouts":["Region cannot be changed after data stores exist","Key cannot be swapped once applied; all connectors share one CMEK config","Cloud KMS billed continuously once registered"],"rationale":"Residency + key-control requirements","source_url":"https://docs.cloud.google.com/gemini/enterprise/docs/cmek"}}}
{"beginRendering":{"surfaceId":"recommendation","root":"card"}}`;

document.getElementById('src').value = SAMPLE;

function render(){
  const lines = document.getElementById('src').value.trim().split(/\r?\n/);
  let data = {};
  for(const ln of lines){
    let msg; try{ msg = JSON.parse(ln); }catch(e){ continue; }
    if(msg.dataModelUpdate){ data = msg.dataModelUpdate.contents || data; }
  }
  const out = document.getElementById('out');
  out.innerHTML = '';
  const c = document.createElement('div'); c.className='card';
  if(data.one_way){ const b=document.createElement('div'); b.className='oneway'; b.textContent='ONE-WAY DECISION'; c.appendChild(b); }
  const h=document.createElement('h2'); h.textContent=data.title||''; c.appendChild(h);
  const s=document.createElement('p'); s.className='sum'; s.textContent=data.summary||''; c.appendChild(s);
  c.appendChild(list('PROS', data.pros, 'pro'));
  c.appendChild(list('WATCH-OUTS', data.watchouts, 'warn'));
  if(data.rationale){ const r=document.createElement('p'); r.className='src'; r.textContent='Rationale: '+data.rationale; c.appendChild(r); }
  if(data.source_url){ const u=document.createElement('p'); u.className='src'; u.innerHTML='Source: <a href="'+data.source_url+'" target="_blank" rel="noopener">'+data.source_url+'</a>'; c.appendChild(u); }
  const row=document.createElement('div'); row.className='row';
  const adj=document.createElement('button'); adj.className='btn-adjust'; adj.textContent='Adjust';
  const app=document.createElement('button'); app.className='btn-approve'; app.textContent=data.one_way?'Approve (one-way)':'Approve & save';
  app.onclick=()=>alert('In the live agent this emits recommendation.approve → save_decision → plan.xlsx');
  row.appendChild(adj); row.appendChild(app); c.appendChild(row);
  out.appendChild(c);
}
function list(label, items, cls){
  const wrap=document.createElement('div');
  const l=document.createElement('div'); l.className='lab'; l.textContent=label; wrap.appendChild(l);
  const ul=document.createElement('ul');
  (items||[]).forEach(t=>{ const li=document.createElement('li'); li.className=cls; li.textContent=t; ul.appendChild(li); });
  wrap.appendChild(ul); return wrap;
}
render();
</script>
</body>
</html>
