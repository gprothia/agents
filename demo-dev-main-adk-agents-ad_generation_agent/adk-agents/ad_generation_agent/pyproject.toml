[tool.poetry]
name = "content_gen_agent"
version = "3.20251212.2"
description = "Product Catalog Ad Generation Agent"
authors = ["Gonzalo Varela <gvarelal@google.com>"]
readme = "README.md"
packages = [
    { include = "ad_generation_agent" },
    { include = "adk_common", from = ".." }
]

[tool.poetry.dependencies]
python = ">=3.13"
google-adk = "1.10.0"
google-cloud-aiplatform = { version = "1.108.0", extras = ["adk", "agent-engines"] }
google-cloud-bigquery = "3.38.0"
google-genai = "^1.52.0"
pydantic = "2.11.7"
absl-py = "2.3.1"
python-dotenv = "1.1.1"

pandas = "2.3.3"
toolbox-core = "0.5.3"
moviepy = "2.2.1"
google-cloud-texttospeech = "2.33.0"
soundfile = "0.13.1"
aiohttp = "3.12.15"

[tool.poetry.group.dev.dependencies]
pytest = "9.0.1"
flake8 = "7.3.0"
python-dotenv = "1.1.1"
pytest-asyncio = "1.3.0"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
