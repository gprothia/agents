<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 1560" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1 1L9 5L1 9" fill="none" stroke="#475569" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrRed" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1 1L9 5L1 9" fill="none" stroke="#dc2626" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <style>
    .zone-label { font-size: 15px; font-weight: 700; fill: #334155; }
    .zone-sub   { font-size: 11px; fill: #64748b; }
    .box-title  { font-size: 13px; font-weight: 700; fill: #1e293b; }
    .box-sub    { font-size: 10.5px; fill: #475569; }
    .perm       { font-size: 10px; font-weight: 600; fill: #7c3aed; }
    .perm-bg    { fill: #f5f3ff; stroke: #ddd6fe; stroke-width: 1; rx: 4; }
    .flow       { stroke: #475569; stroke-width: 1.6; fill: none; }
    .flow-deny  { stroke: #dc2626; stroke-width: 1.6; fill: none; stroke-dasharray: 5 4; }
    .flow-ctl   { stroke: #94a3b8; stroke-width: 1.3; fill: none; stroke-dasharray: 2 4; }
    .badge      { font-size: 9.5px; font-weight: 700; }
    .step       { font-size: 11px; font-weight: 700; fill: #ffffff; }
  </style>

  <text x="620" y="34" text-anchor="middle" font-size="21" font-weight="800" fill="#0f172a">askHR — Governed Agent Architecture (Gemini Enterprise Agent Platform)</text>
  <text x="620" y="54" text-anchor="middle" font-size="12" fill="#64748b">Every component, identity, role and enforcement checkpoint</text>

  <!-- ══════════ USER LAYER ══════════ -->
  <rect x="440" y="76" width="360" height="64" rx="12" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="620" y="102" text-anchor="middle" class="box-title">Gemini Enterprise (Agent Gallery)</text>
  <text x="620" y="120" text-anchor="middle" class="box-sub">Employee chats with askHR • agent registered to GE instance</text>

  <line x1="620" y1="140" x2="620" y2="176" class="flow" marker-end="url(#arr)"/>
  <circle cx="598" cy="158" r="9" fill="#2563eb"/><text x="598" y="162" text-anchor="middle" class="step">1</text>

  <!-- ══════════ GOOGLE-MANAGED ZONE ══════════ -->
  <rect x="40" y="180" width="1160" height="560" rx="16" fill="#fafafa" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="8 5"/>
  <text x="60" y="206" class="zone-label">GOOGLE-MANAGED ENVIRONMENT</text>
  <text x="60" y="222" class="zone-sub">Runs outside your project — each service needs explicit authorization to touch your resources</text>

  <!-- Agent Runtime -->
  <rect x="330" y="240" width="580" height="200" rx="12" fill="#ffffff" stroke="#6366f1" stroke-width="2"/>
  <text x="620" y="264" text-anchor="middle" class="box-title">Agent Runtime — askHR agent (ADK LlmAgent)</text>
  <text x="620" y="281" text-anchor="middle" class="box-sub">No hardcoded tool URLs • OpenTelemetry instrumented • deployed via agent_engines.create()</text>

  <!-- two badges -->
  <rect x="352" y="296" width="256" height="126" rx="8" fill="#fef9c3" stroke="#eab308" stroke-width="1.2"/>
  <text x="480" y="316" text-anchor="middle" class="badge" fill="#854d0e">RUNTIME SA (company car)</text>
  <text x="480" y="331" text-anchor="middle" font-size="9.5" fill="#713f12">askhr-mcp-invoker@…</text>
  <text x="364" y="349" font-size="9.5" fill="#713f12">• roles/run.invoker → 3 Cloud Run svcs</text>
  <text x="364" y="363" font-size="9.5" fill="#713f12">• roles/aiplatform.user → Gemini model</text>
  <text x="364" y="377" font-size="9.5" fill="#713f12">• logging.logWriter + cloudtrace.agent</text>
  <text x="364" y="391" font-size="9.5" fill="#713f12">• storage.objectViewer → staging bucket</text>
  <text x="364" y="405" font-size="9.5" fill="#713f12">• agentregistry viewer → discovery</text>

  <rect x="632" y="296" width="256" height="126" rx="8" fill="#dcfce7" stroke="#22c55e" stroke-width="1.2"/>
  <text x="760" y="316" text-anchor="middle" class="badge" fill="#166534">AGENT IDENTITY (driver's license)</text>
  <text x="760" y="331" text-anchor="middle" font-size="9.5" fill="#14532d">principal://aiplatform…/reasoningEngines/ID</text>
  <text x="644" y="349" font-size="9.5" fill="#14532d">• minted automatically • mTLS + DPoP</text>
  <text x="644" y="363" font-size="9.5" fill="#14532d">• iap.egressor → employee-directory</text>
  <text x="644" y="377" font-size="9.5" fill="#14532d">• iap.egressor → benefits-payroll</text>
  <text x="644" y="391" font-size="9.5" fill="#14532d">• iap.egressor + CEL(isReadOnly) → hr-actions</text>
  <text x="644" y="405" font-size="9.5" fill="#14532d">• checked at gateway on EVERY tool call</text>

  <!-- Registry -->
  <rect x="70" y="252" width="220" height="140" rx="12" fill="#ffffff" stroke="#0ea5e9" stroke-width="2"/>
  <text x="180" y="276" text-anchor="middle" class="box-title">Agent Registry (regional)</text>
  <text x="82" y="296" class="box-sub">Source of truth — approved only:</text>
  <text x="82" y="312" font-size="10" fill="#0c4a6e">• employee-directory + toolspec</text>
  <text x="82" y="326" font-size="10" fill="#0c4a6e">• benefits-payroll + toolspec</text>
  <text x="82" y="340" font-size="10" fill="#0c4a6e">• hr-actions + toolspec (readOnly hints)</text>
  <text x="82" y="354" font-size="10" fill="#0c4a6e">• askhr-agent (auto-registered)</text>
  <text x="82" y="374" font-size="9.5" fill="#0369a1" font-weight="600">Unregistered ⇒ blocked by gateway</text>

  <line x1="330" y1="330" x2="290" y2="322" class="flow" marker-end="url(#arr)"/>
  <rect x="242" y="288" width="140" height="16" class="perm-bg"/>
  <text x="312" y="300" text-anchor="middle" class="perm">2 discover (registry viewer)</text>

  <!-- Gemini model -->
  <rect x="950" y="252" width="220" height="80" rx="12" fill="#ffffff" stroke="#a855f7" stroke-width="2"/>
  <text x="1060" y="278" text-anchor="middle" class="box-title">Gemini model (Vertex AI)</text>
  <text x="1060" y="296" text-anchor="middle" class="box-sub">gemini-2.5-flash • reasoning</text>
  <text x="1060" y="316" text-anchor="middle" class="perm">SA: roles/aiplatform.user</text>
  <line x1="910" y1="300" x2="948" y2="292" class="flow" marker-end="url(#arr)"/>

  <!-- Platform service agents note -->
  <rect x="950" y="352" width="220" height="118" rx="10" fill="#fff7ed" stroke="#fb923c" stroke-width="1.2"/>
  <text x="1060" y="372" text-anchor="middle" class="badge" fill="#9a3412">GOOGLE SERVICE AGENTS</text>
  <text x="960" y="390" font-size="9.5" fill="#7c2d12">gcp-sa-aiplatform / -re:</text>
  <text x="960" y="404" font-size="9.5" fill="#7c2d12">• compute.networkViewer + networkUser</text>
  <text x="960" y="418" font-size="9.5" fill="#7c2d12">  (read + use your network attachment)</text>
  <text x="960" y="436" font-size="9.5" fill="#7c2d12">gcp-sa-dep (gateway):</text>
  <text x="960" y="450" font-size="9.5" fill="#7c2d12">• modelarmor.calloutUser + user</text>
  <text x="960" y="464" font-size="9.5" fill="#7c2d12">• serviceusage.serviceUsageConsumer</text>

  <!-- Gateway -->
  <rect x="330" y="480" width="580" height="240" rx="12" fill="#ffffff" stroke="#dc2626" stroke-width="2"/>
  <text x="620" y="504" text-anchor="middle" class="box-title">AGENT GATEWAY — askhr-agent-gateway (security desk)</text>
  <text x="620" y="520" text-anchor="middle" class="box-sub">Mode: AGENT_TO_ANYWHERE (egress) • bound to Agent Registry • all agent egress transits here</text>

  <rect x="352" y="534" width="256" height="168" rx="8" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.2"/>
  <text x="480" y="554" text-anchor="middle" class="badge" fill="#991b1b">REQUEST_AUTHZ → IAP</text>
  <text x="480" y="569" text-anchor="middle" font-size="9.5" fill="#7f1d1d">identity check, per request</text>
  <text x="364" y="588" font-size="9.5" fill="#7f1d1d">Q: does AGENT IDENTITY hold</text>
  <text x="364" y="601" font-size="9.5" fill="#7f1d1d">roles/iap.egressor on THIS destination?</text>
  <text x="364" y="619" font-size="9.5" fill="#7f1d1d">CEL attributes available:</text>
  <text x="364" y="633" font-size="9.5" fill="#7f1d1d">• mcp.toolName</text>
  <text x="364" y="647" font-size="9.5" fill="#7f1d1d">• mcp.tool.isReadOnly</text>
  <text x="364" y="667" font-size="9.5" font-weight="700" fill="#dc2626">hr-actions writes ⇒ 403 DENY</text>
  <text x="364" y="683" font-size="9.5" fill="#7f1d1d">(ReadOnlyToolsOnly condition)</text>

  <rect x="632" y="534" width="256" height="168" rx="8" fill="#f0fdf4" stroke="#86efac" stroke-width="1.2"/>
  <text x="760" y="554" text-anchor="middle" class="badge" fill="#166534">CONTENT_AUTHZ → MODEL ARMOR</text>
  <text x="760" y="569" text-anchor="middle" font-size="9.5" fill="#14532d">content check, both directions</text>
  <text x="644" y="588" font-size="9.5" fill="#14532d">Prompts: injection + jailbreak screen,</text>
  <text x="644" y="601" font-size="9.5" fill="#14532d">RAI filters (template: askhr-guardrails)</text>
  <text x="644" y="619" font-size="9.5" fill="#14532d">Responses: SDP/DLP de-identify —</text>
  <text x="644" y="633" font-size="9.5" fill="#14532d">• inspect: SSN, routing, acct numbers</text>
  <text x="644" y="647" font-size="9.5" fill="#14532d">• replace: [REDACTED-BY-MODEL-ARMOR]</text>
  <text x="644" y="667" font-size="9.5" font-weight="700" fill="#166534">payslip SSN never reaches agent/user</text>
  <text x="644" y="683" font-size="9.5" fill="#14532d">(DLP templates in same region)</text>

  <line x1="620" y1="440" x2="620" y2="476" class="flow" marker-end="url(#arr)"/>
  <circle cx="598" cy="458" r="9" fill="#2563eb"/><text x="598" y="462" text-anchor="middle" class="step">3</text>
  <rect x="636" y="450" width="150" height="16" class="perm-bg"/>
  <text x="711" y="462" text-anchor="middle" class="perm">tool call carries Agent Identity</text>

  <!-- ══════════ CUSTOMER VPC ZONE ══════════ -->
  <rect x="40" y="770" width="1160" height="420" rx="16" fill="#f0fdfa" stroke="#14b8a6" stroke-width="1.8"/>
  <text x="60" y="796" class="zone-label" fill="#0f766e">YOUR PROJECT — VPC askhr-vpc (10.10.0.0/24)</text>
  <text x="60" y="812" class="zone-sub">Territory you control — your rules, your logs, your firewall</text>

  <!-- network attachment -->
  <rect x="470" y="824" width="300" height="64" rx="10" fill="#ffffff" stroke="#0d9488" stroke-width="1.6"/>
  <text x="620" y="848" text-anchor="middle" class="box-title">PSC-Interface Network Attachment</text>
  <text x="620" y="866" text-anchor="middle" class="box-sub">askhr-psc-attachment • the docking port into your VPC</text>

  <line x1="620" y1="720" x2="620" y2="820" class="flow" marker-end="url(#arr)"/>
  <circle cx="598" cy="762" r="9" fill="#2563eb"/><text x="598" y="766" text-anchor="middle" class="step">4</text>
  <rect x="636" y="742" width="228" height="30" class="perm-bg"/>
  <text x="750" y="754" text-anchor="middle" class="perm">bound at deploy: psc_interface_config</text>
  <text x="750" y="766" text-anchor="middle" class="perm">svc agents need networkViewer/User</text>

  <!-- NAT -->
  <rect x="490" y="916" width="260" height="52" rx="10" fill="#ffffff" stroke="#0d9488" stroke-width="1.4"/>
  <text x="620" y="938" text-anchor="middle" class="box-title">Cloud NAT (askhr-nat)</text>
  <text x="620" y="954" text-anchor="middle" class="box-sub">only exit to internet • flow logs • one-way glass</text>
  <line x1="620" y1="888" x2="620" y2="912" class="flow" marker-end="url(#arr)"/>

  <!-- Cloud Run row -->
  <text x="620" y="1002" text-anchor="middle" class="zone-label" fill="#0f766e">Cloud Run — MCP tool servers (--no-allow-unauthenticated, each with own SA)</text>
  <line x1="620" y1="968" x2="620" y2="984" class="flow"/>
  <line x1="200" y1="984" x2="1040" y2="984" class="flow"/>
  <line x1="200" y1="984" x2="200" y2="1016" class="flow" marker-end="url(#arr)"/>
  <line x1="620" y1="984" x2="620" y2="1016" class="flow" marker-end="url(#arr)"/>
  <line x1="1040" y1="984" x2="1040" y2="1016" class="flow-deny" marker-end="url(#arrRed)"/>

  <circle cx="176" cy="1002" r="9" fill="#2563eb"/><text x="176" y="1006" text-anchor="middle" class="step">5</text>

  <rect x="80" y="1020" width="240" height="140" rx="10" fill="#ffffff" stroke="#0284c7" stroke-width="1.6"/>
  <text x="200" y="1042" text-anchor="middle" class="box-title">employee-directory</text>
  <text x="200" y="1058" text-anchor="middle" class="box-sub">SA: askhr-employee-directory@…</text>
  <text x="92" y="1078" font-size="10" fill="#0c4a6e">READ-ONLY tools:</text>
  <text x="92" y="1092" font-size="10" fill="#0c4a6e">• lookup_employee</text>
  <text x="92" y="1106" font-size="10" fill="#0c4a6e">• get_org_chart</text>
  <text x="92" y="1120" font-size="10" fill="#0c4a6e">• search_hr_policies</text>
  <text x="200" y="1146" text-anchor="middle" class="perm">door: run.invoker (runtime SA) ✓</text>

  <rect x="500" y="1020" width="240" height="140" rx="10" fill="#ffffff" stroke="#0284c7" stroke-width="1.6"/>
  <text x="620" y="1042" text-anchor="middle" class="box-title">benefits-payroll</text>
  <text x="620" y="1058" text-anchor="middle" class="box-sub">SA: askhr-benefits-payroll@…</text>
  <text x="512" y="1078" font-size="10" fill="#0c4a6e">READ-ONLY, PII-bearing:</text>
  <text x="512" y="1092" font-size="10" fill="#0c4a6e">• get_payslip (SSN → redacted @gw)</text>
  <text x="512" y="1106" font-size="10" fill="#0c4a6e">• get_benefits_summary</text>
  <text x="620" y="1146" text-anchor="middle" class="perm">door: run.invoker (runtime SA) ✓</text>

  <rect x="920" y="1020" width="240" height="140" rx="10" fill="#fff1f2" stroke="#e11d48" stroke-width="1.6"/>
  <text x="1040" y="1042" text-anchor="middle" class="box-title">hr-actions</text>
  <text x="1040" y="1058" text-anchor="middle" class="box-sub">SA: askhr-hr-actions@…</text>
  <text x="932" y="1078" font-size="10" fill="#881337">WRITE tools (all denied @gateway):</text>
  <text x="932" y="1092" font-size="10" fill="#881337">• submit_pto_request</text>
  <text x="932" y="1106" font-size="10" fill="#881337">• update_bank_details ⚠ fraud target</text>
  <text x="932" y="1120" font-size="10" fill="#881337">• file_hr_case</text>
  <text x="1040" y="1146" text-anchor="middle" font-size="10" font-weight="700" fill="#dc2626">403 at gateway (CEL) — never reached</text>

  <!-- ══════════ FLOW LEGEND ══════════ -->
  <rect x="40" y="1220" width="1160" height="310" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="60" y="1248" class="zone-label">REQUEST LIFECYCLE + WHO IS CHECKED WHERE</text>

  <text x="60" y="1278" font-size="11.5" fill="#334155"><tspan font-weight="700" fill="#2563eb">①</tspan> Employee asks askHR in Gemini Enterprise → request reaches Agent Runtime.</text>
  <text x="60" y="1300" font-size="11.5" fill="#334155"><tspan font-weight="700" fill="#2563eb">②</tspan> On startup, agent discovers toolsets from Agent Registry (Runtime SA needs registry viewer role). Only registered servers exist for it.</text>
  <text x="60" y="1322" font-size="11.5" fill="#334155"><tspan font-weight="700" fill="#2563eb">③</tspan> Agent reasons with Gemini (SA: aiplatform.user), decides to call a tool. Call carries the AGENT IDENTITY, egress forced toward VPC.</text>
  <text x="60" y="1344" font-size="11.5" fill="#334155"><tspan font-weight="700" fill="#2563eb">④</tspan> Traffic enters your VPC via the network attachment and hits the GATEWAY: IAP checks iap.egressor + CEL (identity), Model Armor screens/redacts (content).</text>
  <text x="60" y="1366" font-size="11.5" fill="#334155"><tspan font-weight="700" fill="#2563eb">⑤</tspan> Approved calls exit via NAT to Cloud Run, where the door lock checks run.invoker on the RUNTIME SA. Tool executes; response passes back through Model Armor (PII redacted) → agent → user.</text>

  <line x1="60" y1="1390" x2="1180" y2="1390" stroke="#e2e8f0" stroke-width="1"/>

  <text x="60" y="1416" font-size="11.5" font-weight="700" fill="#334155">Checkpoint summary — same call, three badges:</text>
  <rect x="60" y="1430" width="352" height="76" rx="8" fill="#dcfce7" stroke="#86efac"/>
  <text x="236" y="1450" text-anchor="middle" font-size="10.5" font-weight="700" fill="#166534">GATEWAY (governance)</text>
  <text x="236" y="1468" text-anchor="middle" font-size="10" fill="#14532d">checks AGENT IDENTITY:</text>
  <text x="236" y="1484" text-anchor="middle" font-size="10" fill="#14532d">iap.egressor per destination + CEL per tool</text>

  <rect x="444" y="1430" width="352" height="76" rx="8" fill="#fef9c3" stroke="#eab308"/>
  <text x="620" y="1450" text-anchor="middle" font-size="10.5" font-weight="700" fill="#854d0e">CLOUD RUN DOOR (infrastructure)</text>
  <text x="620" y="1468" text-anchor="middle" font-size="10" fill="#713f12">checks RUNTIME SA:</text>
  <text x="620" y="1484" text-anchor="middle" font-size="10" fill="#713f12">roles/run.invoker per service</text>

  <rect x="828" y="1430" width="352" height="76" rx="8" fill="#fff7ed" stroke="#fb923c"/>
  <text x="1004" y="1450" text-anchor="middle" font-size="10.5" font-weight="700" fill="#9a3412">PLATFORM (enablement)</text>
  <text x="1004" y="1468" text-anchor="middle" font-size="10" fill="#7c2d12">Google service agents authorized to touch</text>
  <text x="1004" y="1484" text-anchor="middle" font-size="10" fill="#7c2d12">your attachment (compute.*) + Model Armor</text>
</svg>
